# Static serving for the Constella SPA. No upstreams, no proxying, no outside
# call — everything is served from the image.

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Fingerprinted assets are immutable — cache them hard.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, so a rebuilt image is picked up at once.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: the app owns "/" and paths like /v/<slug>, which are
    # not real files. Serve a real file when one exists, otherwise index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
